name: Gelir Gider APK

on:
  push:
    paths:
      - 'gelirgider/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/gelirgider.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Testler (iş mantığı, veritabanı, ekran görüntüleri)
        run: gradle :gelirgider:testDebugUnitTest --no-daemon

      - name: Ekran görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GelirGider-ekran-goruntuleri
          path: gelirgider/build/screenshots/*.png
          if-no-files-found: ignore

      - name: APK derle
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          gradle :gelirgider:assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} -PversionName=$VERSION
          mkdir -p dist
          cp gelirgider/build/outputs/apk/release/gelirgider-release.apk "dist/GelirGider-v$VERSION.apk"

      - name: APK'yı yükle (Actions sekmesi)
        uses: actions/upload-artifact@v4
        with:
          name: GelirGider-v${{ env.VERSION }}
          path: dist/*.apk

      # Herkesin telefondan indirebileceği bir sürüm (Releases) yayınlanır
      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gelirgider-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Gelir Gider v${{ env.VERSION }}
          make_latest: true
          files: dist/*.apk
          body: |
            Android telefona kurulum:
            1. Aşağıdaki **GelirGider-v${{ env.VERSION }}.apk** dosyasını telefondan indir.
            2. Dosyayı aç; "bilinmeyen kaynaklardan yükleme" izni sorulursa izin ver.
            3. Kur ve aç. Android 8.0 ve üzeri. İnternet gerekmez, veriler telefonda kalır.

            Yeni sürümler eskisinin üzerine kurulur, kayıtların silinmez.
